services:
  - type: web
    name: sana-license-api
    runtime: node
    plan: free
    rootDir: license-service
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sana_licenses
      - key: ADMIN_API_KEY
        sync: false
      - key: ACTIVATION_PRIVATE_KEY_B64
        sync: false
      - key: CORS_ORIGIN
        value: http://tauri.localhost
